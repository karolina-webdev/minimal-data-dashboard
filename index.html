<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Data Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Minimal Data Dashboard</h1>

  <div class="controls">
    <label>City filter:</label>
    <select id="cityFilter">
      <option value="all">All</option>
      <option value="Tallinn">Tallinn</option>
      <option value="Tartu">Tartu</option>
      <option value="Narva">Narva</option>
      <option value="Pärnu">Pärnu</option>
    </select>

    <label>Age filter:</label>
    <select id="ageFilter">
      <option value="all">All</option>
      <option value="over25">Age > 25</option>
    </select>

    <button id="sortByName">Sort by name</button>
    <button id="sortByAge">Sort by age</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody id="dataTableBody">
      <!-- JS will insert rows here -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
